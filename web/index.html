<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#111820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motoentrega 3D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Motoentrega 3D — Protótipo</title>
<link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="brand">🏍️ MOTOENTREGA 3D</div>
    <div class="money">R$ <span id="money">0,00</span></div>
  </div>
  <div class="card">
    <div id="status">Pegue um pedido para começar</div>
    <div class="row"><span>Destino</span><b id="destination">—</b></div>
    <div class="row"><span>Tempo</span><b id="timer">03:00</b></div>
    <div class="row"><span>Velocidade</span><b><span id="speed">0</span> km/h</b></div>
  </div>
</div>
<div id="message"></div>
<button id="start">📦 PEGAR PEDIDO</button>
<div id="controls">
  <button data-key="left">◀</button>
  <button data-key="up">▲</button>
  <button data-key="down">▼</button>
  <button data-key="right">▶</button>
</div>
<script type="module" src="./game.js?v=4"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
</body>
</html>
