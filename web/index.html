<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#111820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motoentrega 3D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Motoentrega 3D — Protótipo</title>
<link rel="stylesheet" href="./style.css?v=12">
</head>
<body>
<div id="boot">Carregando mapa 3D…</div>
<div id="runtimeError" hidden></div>
<div id="hud">
  <div class="top">
    <div class="brand">🏍️ MOTOENTREGA 3D</div>
    <div class="money">R$ <span id="money">0,00</span></div>
  </div>
  <div class="card">
    <div id="status">Pegue um pedido para começar</div>
    <div class="row"><span>Destino</span><b id="destination">—</b></div>
    <div class="row"><span>Tempo</span><b id="timer">03:00</b></div>
    <div class="row"><span>Velocidade</span><b><span id="speed">0</span> km/h</b></div>
  </div>
</div>
<div id="message"></div>
<div id="mapWrap"><canvas id="minimap" width="180" height="180"></canvas><div id="mapLabel">MAPA</div></div>
<button id="start">📦 PEGAR PEDIDO</button>
<div id="controls">
  <button data-key="left">◀</button>
  <button data-key="up">▲</button>
  <button data-key="down">▼</button>
  <button data-key="right">▶</button>
</div>
<script type="module" src="./game.js?v=12"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
<script>
window.addEventListener('error',e=>{
  const b=document.getElementById('runtimeError');
  if(b && !b.hidden){return;}
  if(b){b.hidden=false;b.innerHTML='<b>Erro ao carregar o jogo</b><br><small>'+String(e.message||'Erro desconhecido').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</small><br><button onclick="location.reload()">Recarregar</button>';}
});
window.addEventListener('unhandledrejection',e=>{
  const b=document.getElementById('runtimeError');
  if(b){b.hidden=false;b.innerHTML='<b>Erro ao carregar o jogo</b><br><small>'+String(e.reason?.message||e.reason||'Falha no módulo 3D').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</small><br><button onclick="location.reload()">Recarregar</button>';}
});
window.addEventListener('load',()=>setTimeout(()=>{const boot=document.getElementById('boot');if(boot)boot.remove()},1200));
</script>
</body>
</html>
