<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Motoentrega 3D — Protótipo</title>
<link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="brand">🏍️ MOTOENTREGA 3D</div>
    <div class="money">R$ <span id="money">0,00</span></div>
  </div>
  <div class="card">
    <div id="status">Pegue um pedido para começar</div>
    <div class="row"><span>Destino</span><b id="destination">—</b></div>
    <div class="row"><span>Tempo</span><b id="timer">03:00</b></div>
    <div class="row"><span>Velocidade</span><b><span id="speed">0</span> km/h</b></div>
  </div>
</div>
<div id="message"></div>
<button id="start">📦 PEGAR PEDIDO</button>
<div id="controls">
  <button data-key="left">◀</button>
  <button data-key="up">▲</button>
  <button data-key="down">▼</button>
  <button data-key="right">▶</button>
</div>
<script type="module" src="./game.js?v=4"></script>
</body>
</html>
